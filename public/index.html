<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARK Raid Methods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>ARK Raid Methods</h1>
        <p class="sub">Every way to break a base in ARK: Survival Evolved — in one place.</p>
        <nav class="nav">
          <a href="index.html" class="active">⚔ Raiding</a>
          <a href="farming.html">⛏ Farming</a>
        </nav>
      </div>
      <button id="addBtn" class="btn primary">+ Add method</button>
    </div>
  </header>

  <main class="wrap">
    <section class="filters">
      <input id="search" type="search" placeholder="Search C4, stego, turrets…">
      <select id="filterCategory"><option value="">All categories</option></select>
      <select id="filterTier"><option value="">All tiers</option></select>
    </section>

    <p id="count" class="count"></p>
    <section id="list" class="grid"></section>
    <p id="empty" class="empty" hidden>No raid methods match. Try another search or add one!</p>
  </main>

  <!-- View one method -->
  <dialog id="viewDialog">
    <article id="viewBody"></article>
    <div class="actions">
      <button id="deleteBtn" class="btn danger">Delete</button>
      <span class="spacer"></span>
      <button id="editBtn" class="btn">Edit</button>
      <button class="btn close">Close</button>
    </div>
  </dialog>

  <!-- Add / edit form -->
  <dialog id="formDialog">
    <form id="raidForm" method="dialog">
      <h2 id="formTitle">Add raid method</h2>

      <label>Title<input name="title" required maxlength="120"></label>

      <div class="row">
        <label>Category<select name="category" required></select></label>
        <label>Structure tier<select name="tier" required></select></label>
        <label>Difficulty<select name="difficulty" required></select></label>
      </div>

      <label>Short description<textarea name="description" rows="2"></textarea></label>
      <label>What you need <small>(one per line)</small><textarea name="requirements" rows="3"></textarea></label>
      <label>Steps <small>(one per line)</small><textarea name="steps" rows="5" required></textarea></label>
      <label>Tips <small>(one per line)</small><textarea name="tips" rows="2"></textarea></label>
      <label>YouTube videos <small>(one link per line)</small><textarea name="videos" rows="2" placeholder="https://www.youtube.com/watch?v=..."></textarea></label>
      <label>Your name<input name="author" placeholder="Anonymous"></label>

      <p id="formError" class="error" hidden></p>

      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="btn close">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="common.js"></script>
  <script src="raids.js"></script>
</body>
</html>
